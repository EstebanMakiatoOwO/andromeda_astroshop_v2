spring.application.name=crud-fullstack
spring.datasource.url=jdbc:mysql://localhost:3306/customer_managment
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.sql-show=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}

mercadopago.access-token=${MP_ACCESS_TOKEN}
mercadopago.webhook-url=${MP_WEBHOOK_URL}

app.frontend-url=http://localhost:3000

spring.config.import=optional:classpath:application-secrets.properties

